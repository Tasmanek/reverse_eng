<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1300" viewBox="0 0 1680 1300" role="img" aria-labelledby="title desc"><title id="title">Zmiana stopnia otwartości istniejącego zasobu</title><desc id="desc">Dotychczasowa ocena 0–5, wyzwalacz i ponowne obliczenie. Udany zapis zastępuje ocenę nowym wynikiem 0–5; błąd obliczenia przed zapisem pozostawia poprzednią ocenę. Błąd zapisu wymaga sprawdzenia bazy. Zmiana oceny sama nie zmienia statusu publikacji.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#46617d"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#1b8062"/></marker><marker id="red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#b94d43"/></marker></defs><rect width="1680" height="1300" fill="#f4f7fb"/><text x="55" y="65.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" fill="#20364e" text-anchor="start">Zmiana stopnia otwartości zasobu</text><text x="55" y="104.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#526b84" text-anchor="start">Diagram przejść między ocenami • CKAN i XML • istniejący zasób</text><rect x="55" y="135" width="1570" height="75" rx="12" fill="#e8f3ee" stroke="#8dbba8" stroke-width="2"/><text x="82" y="165.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#185c49" text-anchor="start">Zasób opublikowany może mieć ocenę 0–5.</text><text x="82" y="194.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#185c49" text-anchor="start">Sama zmiana oceny nie przełącza zasobu do szkicu ani nie usuwa go z publikacji.</text><rect x="55" y="285" width="300" height="300" rx="18" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/><text x="80" y="325.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#20364e" text-anchor="start">DOTYCHCZASOWA</text><text x="80" y="357.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#20364e" text-anchor="start">OCENA W BAZIE</text><circle cx="88" cy="405" r="19" fill="#e5eaf0" stroke="#6e89a3" stroke-width="1.5"/><text x="88" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">0</text><circle cx="133" cy="405" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="133" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">1</text><circle cx="178" cy="405" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="178" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">2</text><circle cx="223" cy="405" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="223" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">3</text><circle cx="268" cy="405" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="268" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">4</text><circle cx="313" cy="405" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="313" y="412.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">5</text><text x="80" y="460.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#20364e" text-anchor="start">Dowolny punkt wyjścia:</text><text x="80" y="489.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#20364e" text-anchor="start">od 0 do 5.</text><text x="80" y="547.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#64788d" text-anchor="start">0 = brak stopnia 1–5</text><rect x="410" y="285" width="340" height="300" rx="18" fill="#edf4fc" stroke="#9cb9d8" stroke-width="2"/><text x="435" y="325.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#20364e" text-anchor="start">WYZWALACZ</text><text x="435" y="357.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#20364e" text-anchor="start">PRZELICZENIA</text><text x="435" y="375" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">Np. zmiana linku lub</text><text x="435" y="407" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">dostępności, przywrócenie,</text><text x="435" y="439" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">nowy plik pochodny,</text><text x="435" y="471" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">kwalifikujący harmonogram</text><text x="435" y="503" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">lub zmiana reguł tabeli.</text><rect x="805" y="345" width="280" height="175" rx="18" fill="#fff1d1" stroke="#c68b27" stroke-width="2"/><text x="945" y="392.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#20364e" text-anchor="middle">PONOWNE</text><text x="945" y="425.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#20364e" text-anchor="middle">OBLICZENIE</text><text x="945" y="473.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#20364e" text-anchor="middle">Wynik zależy od</text><text x="945" y="498.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#20364e" text-anchor="middle">obecnego stanu danych.</text><polyline points="355,435 410,435" fill="none" stroke="#46617d" stroke-width="3" marker-end="url(#arrow)"/><polyline points="750,435 805,435" fill="none" stroke="#46617d" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160" y="265" width="465" height="220" rx="18" fill="#e8f4ee" stroke="#6ba88e" stroke-width="2"/><text x="1185" y="302.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#19694f" text-anchor="start">OBLICZENIE I ZAPIS UDANE</text><circle cx="1207" cy="355" r="19" fill="#e5eaf0" stroke="#6e89a3" stroke-width="1.5"/><text x="1207" y="362.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">0</text><circle cx="1275" cy="355" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="1275" y="362.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">1</text><circle cx="1343" cy="355" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="1343" y="362.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">2</text><circle cx="1411" cy="355" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="1411" y="362.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">3</text><circle cx="1479" cy="355" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="1479" y="362.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">4</text><circle cx="1547" cy="355" r="19" fill="#e4f1fc" stroke="#6e89a3" stroke-width="1.5"/><text x="1547" y="362.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#20364e" text-anchor="middle">5</text><text x="1185" y="405" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#19694f" text-anchor="start">Nowy wynik zastępuje poprzedni.</text><text x="1185" y="436" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#19694f" text-anchor="start">Może wzrosnąć, spaść lub się nie zmienić.</text><polyline points="1085,410 1125,410 1125,365 1160,365" fill="none" stroke="#1b8062" stroke-width="3" marker-end="url(#green)"/><rect x="1160" y="545" width="465" height="210" rx="18" fill="#fff0ed" stroke="#d2948d" stroke-width="2"/><text x="1185" y="583.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#974239" text-anchor="start">BŁĄD OBLICZENIA</text><text x="1185" y="612.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#974239" text-anchor="start">PRZED ZAPISEM</text><text x="1185" y="663" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#974239" text-anchor="start">Brak nowego wyniku w bazie.</text><text x="1185" y="694" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#974239" text-anchor="start">Pozostaje poprzednia ocena, np. 5.</text><polyline points="1085,460 1125,460 1125,640 1160,640" fill="none" stroke="#b94d43" stroke-width="3" marker-end="url(#red)"/><rect x="55" y="625" width="1030" height="130" rx="12" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/><text x="80" y="660.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#20364e" text-anchor="start">Brak wyzwalacza → brak nowego przeliczenia.</text><text x="80" y="700" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#20364e" text-anchor="start">Sama zmiana opisu lub nazwy formatu nie musi uruchomić oceny.</text><text x="80" y="729" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#20364e" text-anchor="start">Podmiana treści pod niezmienionym URL też sama nie wysyła zdarzenia.</text><text x="55" y="804.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#20364e" text-anchor="start">Przykłady możliwych przejść</text><rect x="55" y="830" width="500" height="225" rx="18" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/><text x="80" y="873.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#20364e" text-anchor="start">2 → 3</text><text x="530" y="867.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#64788d" text-anchor="end">WZROST</text><text x="80" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">Po utworzeniu CSV z arkusza</text><text x="80" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">maksimum ocen plików</text><text x="80" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">może wzrosnąć z 2 do 3.</text><rect x="590" y="830" width="500" height="225" rx="18" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/><text x="615" y="873.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#20364e" text-anchor="start">5 → 1</text><text x="1065" y="867.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#64788d" text-anchor="end">SPADEK</text><text x="615" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">Po przeliczeniu dane są oceniane</text><text x="615" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">na 1, np. PDF, i żaden plik</text><text x="615" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">pochodny nie ma wyższej oceny.</text><rect x="1125" y="830" width="500" height="225" rx="18" fill="#ffffff" stroke="#cbd7e4" stroke-width="2"/><text x="1150" y="873.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#20364e" text-anchor="start">5 → 0</text><text x="1600" y="867.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" fill="#64788d" text-anchor="end">BRAK STOPNIA 1–5</text><text x="1150" y="930" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">Po przeliczeniu np. format zasobu</text><text x="1150" y="962" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">jest None. To nowy wynik 0,</text><text x="1150" y="994" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#20364e" text-anchor="start">a nie błąd przerywający obliczenie.</text><rect x="55" y="1090" width="1570" height="108" rx="12" fill="#fff7e6" stroke="#d6b66d" stroke-width="2"/><text x="80" y="1124.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#805b1c" text-anchor="start">Błąd podczas zapisu do bazy wymaga sprawdzenia rzeczywistego stanu.</text><text x="80" y="1160.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#805b1c" text-anchor="start">Nie zakładamy automatycznego cofnięcia zmian; zapis oceny zasobu i ocen plików może być częściowy.</text><text x="55" y="1237.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#526b84" text-anchor="start">Ważne: nie każdy błąd walidacji lub pobrania przerywa ocenę. Niektóre błędy nadal dają wynik 1–5.</text><text x="55" y="1270.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#64788d" text-anchor="start">Podstawa: lokalny kod mcod 2.62.3. Ocena w bazie i jej odświeżenie na portalu to osobne kroki.</text></svg>