<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc"><title id="title">UML — diagram maszyny stanów oceny otwartości</title><desc id="desc">Sześć stanów oceny zapisanej, stan ponownego obliczania i zapisu, wybór według wyniku oraz historia poprzedniej oceny po błędzie obliczenia. Status publikacji pozostaje niezależny.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1900" height="1400" fill="white"/><text x="60" y="58.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" fill="#20364e" font-weight="700">UML — diagram maszyny stanów oceny otwartości</text><text x="60" y="97.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#5e7388" font-weight="400">Istniejący zasób • CKAN i XML • diagram częściowy: stan wejściowy wynika z wartości w bazie</text><rect x="60" y="140" width="1780" height="360" rx="20" fill="#fbfdff" stroke="#597fa4" stroke-width="2"/><text x="85" y="180.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#20364e" font-weight="700">OcenaZapisana</text><text x="400" y="180.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#5e7388" font-weight="400">Dokładnie jeden aktywny podstan: 0, 1, 2, 3, 4 albo 5</text><path d="M60,196H1840" stroke="#597fa4" stroke-width="1.5"/><rect x="110" y="225" width="240" height="110" rx="16" fill="#f1f3f6" stroke="#3c6184" stroke-width="2"/><text x="230.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">Ocena 0</text><path d="M110,278H350" stroke="#3c6184" stroke-width="1.5"/><text x="128" y="309.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">Brak stopnia 1–5</text><rect x="395" y="225" width="240" height="110" rx="16" fill="#edf4fc" stroke="#3c6184" stroke-width="2"/><text x="515.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">Ocena 1</text><path d="M395,278H635" stroke="#3c6184" stroke-width="1.5"/><text x="413" y="309.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">openness_score = 1</text><rect x="680" y="225" width="240" height="110" rx="16" fill="#edf4fc" stroke="#3c6184" stroke-width="2"/><text x="800.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">Ocena 2</text><path d="M680,278H920" stroke="#3c6184" stroke-width="1.5"/><text x="698" y="309.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">openness_score = 2</text><rect x="965" y="225" width="240" height="110" rx="16" fill="#edf4fc" stroke="#3c6184" stroke-width="2"/><text x="1085.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">Ocena 3</text><path d="M965,278H1205" stroke="#3c6184" stroke-width="1.5"/><text x="983" y="309.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">openness_score = 3</text><rect x="1250" y="225" width="240" height="110" rx="16" fill="#edf4fc" stroke="#3c6184" stroke-width="2"/><text x="1370.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">Ocena 4</text><path d="M1250,278H1490" stroke="#3c6184" stroke-width="1.5"/><text x="1268" y="309.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">openness_score = 4</text><rect x="1535" y="225" width="240" height="110" rx="16" fill="#edf4fc" stroke="#3c6184" stroke-width="2"/><text x="1655.0" y="261.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">Ocena 5</text><path d="M1535,278H1775" stroke="#3c6184" stroke-width="1.5"/><text x="1553" y="309.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">openness_score = 5</text><circle cx="160" cy="430" r="25" fill="white" stroke="#3c6184" stroke-width="2"/><text x="160" y="439.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#20364e" font-weight="700">H</text><text x="210" y="432.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#5e7388" font-weight="400">Historia płytka — ostatni aktywny podstan oceny</text><rect x="440" y="700" width="330" height="145" rx="16" fill="#fff3d8" stroke="#b98228" stroke-width="2"/><text x="605.0" y="736.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">PonowneObliczanie</text><path d="M440,753H770" stroke="#b98228" stroke-width="1.5"/><text x="458" y="784.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">do / oblicz wynik 0–5</text><rect x="850" y="700" width="350" height="145" rx="16" fill="#fff3d8" stroke="#b98228" stroke-width="2"/><text x="1025.0" y="736.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">ZapisywanieOceny</text><path d="M850,753H1200" stroke="#b98228" stroke-width="1.5"/><text x="868" y="784.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">do / zapisz ocenę zasobu,</text><text x="868" y="808.3" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">       następnie oceny plików</text><path d="M1370,755L1395,780L1370,805L1345,780Z" fill="#fff3d8" stroke="#b98228" stroke-width="2"/><path d="M1370,755 L1370,535 L230,535 L230,335" fill="none" stroke="white" stroke-width="7"/><path d="M1370,755 L1370,535 L230,535 L230,335" fill="none" stroke="#1e8063" stroke-width="2" marker-end="url(#arrow)"/><text x="242" y="526.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17624d" font-weight="400">[wynik = 0]</text><path d="M1370,755 L1370,559 L515,559 L515,335" fill="none" stroke="white" stroke-width="7"/><path d="M1370,755 L1370,559 L515,559 L515,335" fill="none" stroke="#1e8063" stroke-width="2" marker-end="url(#arrow)"/><text x="527" y="550.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17624d" font-weight="400">[wynik = 1]</text><path d="M1370,755 L1370,583 L800,583 L800,335" fill="none" stroke="white" stroke-width="7"/><path d="M1370,755 L1370,583 L800,583 L800,335" fill="none" stroke="#1e8063" stroke-width="2" marker-end="url(#arrow)"/><text x="812" y="574.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17624d" font-weight="400">[wynik = 2]</text><path d="M1370,755 L1370,607 L1085,607 L1085,335" fill="none" stroke="white" stroke-width="7"/><path d="M1370,755 L1370,607 L1085,607 L1085,335" fill="none" stroke="#1e8063" stroke-width="2" marker-end="url(#arrow)"/><text x="1097" y="598.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17624d" font-weight="400">[wynik = 3]</text><path d="M1370,755 L1370,631 L1370,631 L1370,335" fill="none" stroke="white" stroke-width="7"/><path d="M1370,755 L1370,631 L1370,631 L1370,335" fill="none" stroke="#1e8063" stroke-width="2" marker-end="url(#arrow)"/><text x="1382" y="622.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17624d" font-weight="400">[wynik = 4]</text><path d="M1370,755 L1370,655 L1655,655 L1655,335" fill="none" stroke="white" stroke-width="7"/><path d="M1370,755 L1370,655 L1655,655 L1655,335" fill="none" stroke="#1e8063" stroke-width="2" marker-end="url(#arrow)"/><text x="1667" y="646.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17624d" font-weight="400">[wynik = 5]</text><path d="M60,380 L22,380 L22,655 L605,655 L605,700" fill="none" stroke="white" stroke-width="7.5"/><path d="M60,380 L22,380 L22,655 L605,655 L605,700" fill="none" stroke="#415a74" stroke-width="2.5" marker-end="url(#arrow)"/><text x="70" y="640.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#20364e" font-weight="400">żądaniePrzeliczenia [wyzwalacz spełniony]</text><path d="M770,775 L850,775" fill="none" stroke="white" stroke-width="7.5"/><path d="M770,775 L850,775" fill="none" stroke="#415a74" stroke-width="2.5" marker-end="url(#arrow)"/><text x="810" y="685.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20364e" font-weight="400">obliczono</text><path d="M1200,775 L1345,780" fill="none" stroke="white" stroke-width="7.5"/><path d="M1200,775 L1345,780" fill="none" stroke="#415a74" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1270" y="837.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20364e" font-weight="400">zapis udany</text><path d="M605,845 L605,955 L160,955 L160,455" fill="none" stroke="white" stroke-width="7.5"/><path d="M605,845 L605,955 L160,955 L160,455" fill="none" stroke="#b4483b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="188" y="890.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#a03930" font-weight="400">błądObliczenia [przed UPDATE]</text><text x="188" y="914.3" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#a03930" font-weight="400">/ pozostaw poprzednią ocenę</text><rect x="1250" y="1000" width="540" height="145" rx="16" fill="#fff0eb" stroke="#b76f60" stroke-width="2"/><text x="1520.0" y="1036.0" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#20364e" font-weight="700">ZapisNiepotwierdzony</text><path d="M1250,1053H1790" stroke="#b76f60" stroke-width="1.5"/><text x="1268" y="1084.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">do / sprawdź rzeczywisty stan bazy;</text><text x="1268" y="1108.3" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#20364e" font-weight="400">       nie zakładaj automatycznego rollbacku</text><path d="M1025,845 L1025,1072 L1250,1072" fill="none" stroke="white" stroke-width="7.5"/><path d="M1025,845 L1025,1072 L1250,1072" fill="none" stroke="#b4483b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1045" y="953.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#a03930" font-weight="400">błądZapisu</text><path d="M1520,1000 L1520,875 L1420,875 L1420,780 L1395,780" fill="none" stroke="white" stroke-width="7.5"/><path d="M1520,1000 L1520,875 L1420,875 L1420,780 L1395,780" fill="none" stroke="#415a74" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1545" y="918.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20364e" font-weight="400">stanUstalony</text><text x="1545" y="940.95" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#20364e" font-weight="400">/ wynik := ocena z bazy</text><rect x="60" y="1195" width="1780" height="72" rx="8" fill="#e9f4ed" stroke="#78a98f" stroke-width="2"/><text x="85" y="1225.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#1c624d" font-weight="700">Status publikacji jest niezależny: sama zmiana oceny nie zmienia published na draft.</text><text x="85" y="1252.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#1c624d" font-weight="400">Zasób może pozostać opublikowany z oceną 0. Aktualizacja oceny na portalu jest osobnym etapem.</text><text x="60" y="1310.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5e7388" font-weight="400">H — powrót do poprzedniej oceny. Romb — wybór jednej gałęzi według warunku. Brak wyzwalacza — pozostanie w dotychczasowym stanie.</text><text x="60" y="1340.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#5e7388" font-weight="400">Możliwe są m.in. 2 → 3, 5 → 1 i 5 → 0. Nie każdy błąd pobrania lub walidacji jest błędem przerywającym obliczenie.</text><text x="60" y="1372.0" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#5e7388" font-weight="400">Model analityczny lokalnego kodu mcod 2.62.3. Stany obliczania i zapisu nie są dodatkowymi wartościami pola status zasobu.</text></svg>