Źródło HTML: #tab=ckan-seq&amp;id=SC-307</title><rect x="605.0" y="135.0" width="190.0" height="90.0" rx="8" fill="#fff0d4" stroke="#46637f"/><text x="700.0" y="177.0" text-anchor="middle"><tspan x="700.0" dy="0">Pobierz treść linku na</tspan><tspan x="700.0" dy="15">potrzeby oceny</tspan></text></g><g class="node"><title>Oblicz ocenę według zapisanego formatu

Ocena linku używa formatu z bazy, także deklaracji CKAN. PDF opisany jako CSV może dostać 3; nie tworzy to kopii pliku. JSON/XML/RDF mają analizę treści; pozostałe formaty ocenę domyślną.

