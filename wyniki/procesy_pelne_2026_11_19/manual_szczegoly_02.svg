<svg xmlns="http://www.w3.org/2000/svg" viewBox="40.0 95.0 2636.0 471.0" role="img" aria-label="1. Edytor — zdefiniowanie i zapis zasobu"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#344c67"/></marker></defs><rect x="40.0" y="95.0" width="2636.0" height="471.0" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#20334b;font-size:13px}.node{cursor:pointer}.node:hover rect{stroke:#147e75;stroke-width:3}</style><polyline points="126.0,203.0 250.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="470.0,203.0 560.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="780.0,203.0 870.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1090.0,203.0 1180.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1400.0,203.0 1445.0,203.0 1445.0,202.0 1490.0,202.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1554.0,202.0 1632.0,202.0 1632.0,203.0 1710.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1637.0" y="194.0" paint-order="stroke" stroke="white" stroke-width="4">Tak</text><polyline points="1522.0,234.0 1522.0,355.0 1260.0,355.0 1260.0,380.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1527.0" y="347.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><polyline points="1150.0,423.0 670.0,423.0 670.0,246.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="675.0" y="415.0" paint-order="stroke" stroke="white" stroke-width="4">Popraw i zapisz</text><polyline points="1930.0,203.0 1975.0,203.0 1975.0,202.0 2020.0,202.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="2084.0,202.0 2167.0,202.0 2167.0,203.0 2250.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="2172.0" y="194.0" paint-order="stroke" stroke="white" stroke-width="4">Tak</text><polyline points="2470.0,203.0 2550.0,203.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="2052.0,234.0 2052.0,375.0 2073.0,375.0 2073.0,400.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="2057.0" y="367.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><g class="node"><title>Rozpoczęcie dodawania zasobu
</title><circle cx="103.0" cy="203.0" r="23.0" fill="#e3f2ed" stroke="#344c67" stroke-width="1.6"/><text x="103.0" y="243.0" text-anchor="middle"><tspan x="103.0" dy="0">Rozpoczęcie dodawania zasobu</tspan></text></g><g class="node"><title>Wskaż plik z dysku lub URL
AddResourceForm / LinkOrFileUploadForm: jedno wejście biznesowe, dwie ścieżki techniczne. Brak bramki wyboru źródła na diagramie zgodnie z wymaganiem.</title><rect x="250.0" y="160.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="360.0" y="207.0" text-anchor="middle"><tspan x="360.0" dy="0">Wskaż plik z dysku lub URL</tspan></text></g><g class="node"><title>Uzupełnij pozostałe pola i status zasobu
M.in. zbiór, tytuł, opis, data danych i status. Szczegółowe wymagania zależą od rodzaju zasobu i uprawnień.</title><rect x="560.0" y="160.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="670.0" y="200.0" text-anchor="middle"><tspan x="670.0" dy="0">Uzupełnij pozostałe pola i</tspan><tspan x="670.0" dy="15">status zasobu</tspan></text></g><g class="node"><title>Kliknij „Zapisz”
</title><rect x="870.0" y="160.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="980.0" y="207.0" text-anchor="middle"><tspan x="980.0" dy="0">Kliknij „Zapisz”</tspan></text></g><g class="node"><title>Sprawdź formularz i reguły pól
AddResourceForm.clean_link: HTTPS; clean_file: obsługiwane rozszerzenie i brak szyfrowanego archiwum. ResourceForm.clean i walidacja modelu: pozostałe reguły, m.in. flagi DGA/HVD. To nie jest jeszcze pełna kontrola pobranych danych.</title><rect x="1180.0" y="160.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1290.0" y="207.0" text-anchor="middle"><tspan x="1290.0" dy="0">Sprawdź formularz i reguły pól</tspan></text></g><g class="node"><title>Formularz poprawny?
</title><polygon points="1522.0,170.0 1554.0,202.0 1522.0,234.0 1490.0,202.0" fill="#fff0d4" stroke="#b58030"/><text x="1522.0" y="207.0" text-anchor="middle">×</text><text x="1522.0" y="158.0" text-anchor="middle"><tspan x="1522.0" dy="0">Formularz poprawny?</tspan></text></g><g class="node"><title>Pokaż błędy; popraw dane
Błędy blokują zapis nowego zasobu; edytor poprawia dane i ponownie zapisuje formularz.</title><rect x="1150.0" y="380.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1260.0" y="427.0" text-anchor="middle"><tspan x="1260.0" dy="0">Pokaż błędy; popraw dane</tspan></text></g><g class="node"><title>Zapisz zasób i wskazany plik lub URL
ResourceAdmin.save_model: obj.save(); plik z dysku → ResourceFile.objects.update_or_create(..., is_main=True). Dla nowego URL sygnał process_resource; dla utworzonego pliku głównego process_created_file.</title><rect x="1710.0" y="160.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1820.0" y="200.0" text-anchor="middle"><tspan x="1820.0" dy="0">Zapisz zasób i wskazany plik</tspan><tspan x="1820.0" dy="15">lub URL</tspan></text></g><g class="node"><title>Zasób jest opublikowany?
Zakres: utworzenie nowego zasobu. Dla nowego szkicu brak zlecenia przetwarzania; pierwsza publikacja szkicu może je uruchomić później.</title><polygon points="2052.0,170.0 2084.0,202.0 2052.0,234.0 2020.0,202.0" fill="#fff0d4" stroke="#b58030"/><text x="2052.0" y="207.0" text-anchor="middle">×</text><text x="2052.0" y="158.0" text-anchor="middle"><tspan x="2052.0" dy="0">Zasób jest opublikowany?</tspan></text></g><g class="node"><title>Zleć przygotowanie zasobu po zatwierdzeniu zapisu
Plik z dysku: process_created_file → entrypoint_process_resource_file_validation_task. URL: process_resource → entrypoint_process_resource_validation_task. Oba apply_async_on_commit. Przyjęto zwykłe dodanie jednego źródła plik ALBO URL.</title><rect x="2250.0" y="160.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="2360.0" y="200.0" text-anchor="middle"><tspan x="2360.0" dy="0">Zleć przygotowanie zasobu po</tspan><tspan x="2360.0" dy="15">zatwierdzeniu zapisu</tspan></text></g><g class="node"><title>Zapis zakończony; praca w tle
</title><circle cx="2573.0" cy="203.0" r="23.0" fill="#f5d9df" stroke="#344c67" stroke-width="3"/><text x="2573.0" y="243.0" text-anchor="middle"><tspan x="2573.0" dy="0">Zapis zakończony; praca w</tspan><tspan x="2573.0" dy="15">tle</tspan></text></g><g class="node"><title>Zapisano szkic; bez tego przetwarzania
</title><circle cx="2073.0" cy="423.0" r="23.0" fill="#f5d9df" stroke="#344c67" stroke-width="3"/><text x="2073.0" y="463.0" text-anchor="middle"><tspan x="2073.0" dy="0">Zapisano szkic; bez tego</tspan><tspan x="2073.0" dy="15">przetwarzania</tspan></text></g></svg>