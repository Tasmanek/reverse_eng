Niepoprawny lub pusty graf RDF → 3; graf bez linked data → 4; graf z linked data → 5. Nie zastępuj tego ogólną walidacją poprawności danych biznesowych.

Źródło HTML: #tab=ocena&amp;id=ROW-ocena-001</title><rect x="605.0" y="135.0" width="190.0" height="90.0" rx="8" fill="#fff0d4" stroke="#46637f"/><text x="700.0" y="177.0" text-anchor="middle"><tspan x="700.0" dy="0">Oblicz ocenę JSON przez</tspan><tspan x="700.0" dy="15">próbę odczytu RDF</tspan></text></g><g class="node"><title>Oblicz ocenę XML
Domyślnie 3; wszystkie elementy w przestrzeniach nazw → 4; poprawny RDF z linked data → 5.

Źródło HTML: #tab=ocena&amp;id=ROW-ocena-002</title><rect x="605.0" y="325.0" width="190.0" height="90.0" rx="8" fill="#fff0d4" stroke="#46637f"/><text x="700.0" y="374.0" text-anchor="middle"><tspan x="700.0" dy="0">Oblicz ocenę XML</tspan></text></g><g class="node"><title>Oblicz ocenę formatu RDF
Domyślnie 4; graf z trójkami i linked data → 5. linked data w tej implementacji: URI z więcej niż jednej domeny, pomijając predykaty rdf:.

Źródło HTML: #tab=ocena&amp;id=ROW-ocena-003</title><rect x="605.0" y="515.0" width="190.0" height="90.0" rx="8" fill="#fff0d4" stroke="#46637f"/><text x="700.0" y="564.0" text-anchor="middle"><tspan x="700.0" dy="0">Oblicz ocenę formatu RDF</tspan></text></g><g class="node"><title>Użyj oceny domyślnej formatu
Bez analizy treści. Przykłady: PDF 1, XLS/XLSX 2, CSV/HTML 3. Format spoza listy → 1. Wartości szczegółowe wynikają z tabeli HTML; nie traktuj oceny jako sprawdzenia merytorycznej jakości.

