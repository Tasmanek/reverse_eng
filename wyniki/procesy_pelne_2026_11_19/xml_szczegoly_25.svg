Oceny domyślne: PDF 1; XLS/XLSX 2; CSV/HTML 3; format spoza listy 1. Kalkulatory JSON/XML/RDF analizują treść; linked data oznacza URI z więcej niż jednej domeny. Ocena nie potwierdza prawdziwości ani kompletności danych.

