Zaszyfrowane → 0; wiele plików → 1, z wyjątkiem geotiff/shp; jeden plik → oceniany wewnętrzny plik. Błąd archiwum → 1. Format compressed_file_format ma pierwszeństwo nad formatem archiwum.

