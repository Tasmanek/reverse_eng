XML: intIdent wskazuje istniejący zbiór; bez niego ext_ident + źródło. CKAN: id → ext_ident + źródło. Zmiana zewnętrznego identyfikatora może utworzyć nowy rekord i wycofać stary. Trwale usunięty rekord nie zostaje zwyczajnie przywrócony (T-USUW).

