Warunkowe pobranie CSV przez API_URL_INTERNAL, CSVW/RDF, zapis JSON-LD. Błąd logowany, brak nowego pliku; w teście brak wewnętrznego API. Nie uznajemy powodzenia za gwarantowane. Szczegółowe sekcje dopuszczają tę próbę dla remote — V-03 README.

