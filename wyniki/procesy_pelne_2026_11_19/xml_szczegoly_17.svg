daily/weekly: interwał 1/7 dni od autoDataDateStart 00:05; monthly: crontab, w tym ostatni dzień miesiąca. Koniec autoDataDateEnd 01:00. Wykonanie: data_date=dzisiaj; API/WWW odświeżenie publikacji; plik remote ponowne przygotowanie. Nie dokładamy wykonania wszystkich przyszłych okresów do instancji importu.

