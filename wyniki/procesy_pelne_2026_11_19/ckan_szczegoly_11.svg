Źródło HTML: #tab=ckan-seq&amp;id=SC-207</title><polygon points="450.0,153.0 477.0,180.0 450.0,207.0 423.0,180.0" fill="#fff0d4" stroke="#b58030"/><text x="450.0" y="185.0" text-anchor="middle">×</text><text x="450.0" y="128.0" text-anchor="middle"><tspan x="450.0" dy="0">Jaki stan zmiany wyznaczył</tspan><tspan x="450.0" dy="15">zapis?</tspan></text></g><g class="node"><title>Zleć ES, RDF i powiadomienie odpowiednie do stanu
Osobne, warunkowe zlecenia według SIGNALS_MAP. Publikacja opisów nie czeka na przygotowanie pliku. Zlecenie nie gwarantuje wykonania. Kolejki indexing/graphs/watchers.

