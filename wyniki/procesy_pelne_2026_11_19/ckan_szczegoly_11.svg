Źródło HTML: #tab=ckan-seq&amp;id=SC-15</title><rect x="605.0" y="135.0" width="190.0" height="90.0" rx="8" fill="#fff" stroke="#46637f"/><text x="700.0" y="170.0" text-anchor="middle"><tspan x="700.0" dy="0">Zleć ES, RDF i</tspan><tspan x="700.0" dy="15">powiadomienie odpowiednie</tspan><tspan x="700.0" dy="15">do stanu</tspan></text></g><g class="node"><title>Zleć wycofanie publikacji i skutki usunięcia
ES/RDF: usunięcie; powiadomienie removed. Zbiór draft sprowadza zasoby do draft. Usunięty zbiór usuwa powiązane zasoby. Każdy zasób ma własne skutki stanu removed.

