Źródło HTML: #tab=ckan-seq&amp;id=SC-207</title><circle cx="200.0" cy="180.0" r="18.0" fill="#e3f2ed" stroke="#344c67" stroke-width="1.6"/><text x="200.0" y="215.0" text-anchor="middle"><tspan x="200.0" dy="0">Obiekt po zapisie</tspan></text></g><g class="node"><title>Jaki stan zmiany wyznaczył zapis?
Stan wyznaczany synchronicznie w procesie zapisującym. published: głównie nowy obiekt; updated: publikacja → publikacja; restored: przywrócenie, również pierwsza publikacja szkicu (T-08); removed: publikacja → szkic/usunięcie. Brak stanu: np. nowy szkic.

