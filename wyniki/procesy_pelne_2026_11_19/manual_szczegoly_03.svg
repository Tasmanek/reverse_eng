="602.0,774.0 602.0,930.0 1262.0,930.0 1262.0,1040.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="607.0" y="922.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><polyline points="1142.0,774.0 1142.0,930.0 1262.0,930.0 1262.0,1040.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1147.0" y="922.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><polyline points="1412.0,774.0 1412.0,930.0 1262.0,930.0 1262.0,1040.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1417.0" y="922.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><polyline points="1972.0,774.0 1972.0,930.0 1262.0,930.0 1262.0,1040.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1977.0" y="922.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><polyline points="2280.0,786.0 2280.0,930.0 1262.0,930.0 1262.0,1040.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1294.0,1072.0 1382.0,1072.0 1382.0,1073.0 1470.0,1073.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1690.0,1073.0 1800.0,1073.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="2020.0,1073.0 2070.0,1073.0 2070.0,1072.0 2120.0,1072.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="2184.0,1072.0 2267.0,1072.0 2267.0,1073.0 2350.0,1073.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="2272.0" y="1064.0" paint-order="stroke" stroke="white" stroke-width="4">Tak</text><polyline points="2570.0,1073.0 2640.0,1073.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="2152.0,1104.0 2152.0,1215.0 2120.0,1215.0 2120.0,1240.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="2157.0" y="1207.0" paint-order="stroke" stroke="white" stroke-width="4">Nie</text><polyline points="2230.0,1283.0 2663.0,1283.0 2663.0,1096.0" fill="none" stroke="#344c67" stroke-width="1.6"  marker-end="url(#arrow)"/><g class="node"><title>Odebrano zlecenie przygotowania
</title><circle cx="103.0" cy="743.0" r="23.0" fill="#e3f2ed" stroke="#344c67" stroke-width="1.6"/><text x="103.0" y="783.0" text-anchor="middle"><tspan x="103.0" dy="0">Odebrano zlecenie</tspan><tspan x="103.0" dy="15">przygotowania</tspan></text></g><g class="node"><title>Sprawdź URL i pobierz treść — jeżeli podano URL
Dla URL: URLValidator, HTTPS po przekierowaniu, HTTP 200, Content-Type, rozpoznanie typu i formatu; dla pliku zapis kopii głównej. Dla pliku z dysku etap HTTP nie jest wykonywany: wejście trafia do entrypoint_res_file. Jest to skrót prezentacyjny, nie dodatkowe wywołanie w kodzie.</title><rect x="250.0" y="700.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="360.0" y="740.0" text-anchor="middle"><tspan x="360.0" dy="0">Sprawdź URL i pobierz treść —</tspan><tspan x="360.0" dy="15">jeżeli podano URL</tspan></text></g><g class="node"><title>Można wykonać wymaganą kontrolę pliku?
URL: etap adresu udany, brak odroczonego błędu, typ file albo API z forced_file_type; helper wymaga pliku głównego. Dysk: zapisany plik główny jest kierowany do kontroli. API/WWW bez pliku oraz nieudany URL pomijają kontrolę pliku i tabeli.</title><polygon points="602.0,710.0 634.0,742.0 602.0,774.0 570.0,742.0" fill="#fff0d4" stroke="#b58030"/><text x="602.0" y="747.0" text-anchor="middle">×</text><text x="602.0" y="685.0" text-anchor="middle"><tspan x="602.0" dy="0">Można wykonać wymaganą</tspan><tspan x="602.0" dy="15">kontrolę pliku?</tspan></text></g><g class="node"><title>Zweryfikuj plik główny
process_resource_res_file_task: analyze_file, format, MIME, kodowanie i archiwum; check_support, błąd nieznanego kodowania CSV. Dla pliku z dysku aktualizuje także link zasobu na adres portalu. Nie oznacza sprawdzenia prawdziwości danych.</title><rect x="790.0" y="700.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="900.0" y="747.0" text-anchor="middle"><tspan x="900.0" dy="0">Zweryfikuj plik główny</tspan></text></g><g class="node"><title>Kontrola pliku udana?
</title><polygon points="1142.0,710.0 1174.0,742.0 1142.0,774.0 1110.0,742.0" fill="#fff0d4" stroke="#b58030"/><text x="1142.0" y="747.0" text-anchor="middle">×</text><text x="1142.0" y="698.0" text-anchor="middle"><tspan x="1142.0" dy="0">Kontrola pliku udana?</tspan></text></g><g class="node"><title>Dane kwalifikują się do przetwarzania?
Resource.is_data_processable: format CSV/TSV/XLS/XLSX/ODS/SHP (także wnętrze archiwum), istniejący plik główny, instytucja inna niż developer.</title><polygon points="1412.0,710.0 1444.0,742.0 1412.0,774.0 1380.0,742.0" fill="#fff0d4" stroke="#b58030"/><text x="1412.0" y="747.0" text-anchor="middle">×</text><text x="1412.0" y="685.0" text-anchor="middle"><tspan x="1412.0" dy="0">Dane kwalifikują się do</tspan><tspan x="1412.0" dy="15">przetwarzania?</tspan></text></g><g class="node"><title>Sprawdź dane tabelaryczne i zindeksuj wiersze
process_resource_file_data_task: ustal schemat, resource.data.validate(), resource.data.index(force=True). Wyniki i błędy są zapisywane. Indeks wierszy jest osobny od indeksu opisów zasobów.</title><rect x="1620.0" y="700.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1730.0" y="740.0" text-anchor="middle"><tspan x="1730.0" dy="0">Sprawdź dane tabelaryczne i</tspan><tspan x="1730.0" dy="15">zindeksuj wiersze</tspan></text></g><g class="node"><title>Zindeksowano dane?
Kod zleca konwersje, gdy success jest prawdziwe; może istnieć również licznik failed. Nie interpretujemy tej bramki jako gwarancji braku każdego błędu wiersza.</title><polygon points="1972.0,710.0 2004.0,742.0 1972.0,774.0 1940.0,742.0" fill="#fff0d4" stroke="#b58030"/><text x="1972.0" y="747.0" text-anchor="middle">×</text><text x="1972.0" y="698.0" text-anchor="middle"><tspan x="1972.0" dy="0">Zindeksowano dane?</tspan></text></g><g class="node"><title>Zleć osobne zadanie plików pochodnych
increase_openness_score_task.apply_async_on_commit po sukcesie indeksacji. Nie czekaj na konwersje. Bramka kwalifikacji konwersji jest w osobnym procesie.</title><rect x="2170.0" y="700.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="2280.0" y="740.0" text-anchor="middle"><tspan x="2280.0" dy="0">Zleć osobne zadanie plików</tspan><tspan x="2280.0" dy="15">pochodnych</tspan></text></g><g class="node"><title>Przejdź do oceny dostępnego stanu
</title><polygon points="1262.0,1040.0 1294.0,1072.0 1262.0,1104.0 1230.0,1072.0" fill="#fff0d4" stroke="#b58030"/><text x="1262.0" y="1077.0" text-anchor="middle">×</text><text x="1262.0" y="1015.0" text-anchor="middle"><tspan x="1262.0" dy="0">Przejdź do oceny dostępnego</tspan><tspan x="1262.0" dy="15">stanu</tspan></text></g><g class="node"><title>NADAJ STOPIEŃ OTWARTOŚCI
Tu obliczana jest pierwsza ocena. Wywołanie update_resource_openness_score po przewidzianych etapach URL/pliku/danych, również gdy wcześniejsza kontrola się nie powiodła. Wyjątek samego obliczenia może przerwać zadanie; nie wymuszamy 0 za każdy błąd.</title><rect x="1470.0" y="1030.0" width="220.0" height="86.0" rx="8" fill="#fff0d4" stroke="#46637f"/><text x="1580.0" y="1112.0" text-anchor="middle" font-weight="bold">⊞</text><text x="1580.0" y="1077.0" text-anchor="middle"><tspan x="1580.0" dy="0">NADAJ STOPIEŃ OTWARTOŚCI</tspan></text></g><g class="node"><title>Zapisz datę weryfikacji, jeśli żądana
Data weryfikacji nie stanowi potwierdzenia aktualności merytorycznej danych.</title><rect x="1800.0" y="1030.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1910.0" y="1070.0" text-anchor="middle"><tspan x="1910.0" dy="0">Zapisz datę weryfikacji, jeśli</tspan><tspan x="1910.0" dy="15">żądana</tspan></text></g><g class="node"><title>Przebieg udany i zasób nadal opublikowany?
Dla URL: sukces URL i wymaganej kontroli pliku, brak deferred_exceptions. Dla dysku: sukces pliku i brak deferred_exceptions. update_es_and_rdf_db dodatkowo wymaga is_published.</title><polygon points="2152.0,1040.0 2184.0,1072.0 2152.0,1104.0 2120.0,1072.0" fill="#fff0d4" stroke="#b58030"/><text x="2152.0" y="1077.0" text-anchor="middle">×</text><text x="2152.0" y="1015.0" text-anchor="middle"><tspan x="2152.0" dy="0">Przebieg udany i zasób nadal</tspan><tspan x="2152.0" dy="15">opublikowany?</tspan></text></g><g class="node"><title>Zleć odświeżenie publikacji i oceny
ES/RDF odczytają już zapisaną ocenę. Sygnały publikacji przy zapisie mogły wcześniej zlecić aktualizację opisów; nie oznacza to oczekiwania formularza na walidację.</title><rect x="2350.0" y="1030.0" width="220.0" height="86.0" rx="8" fill="#fff0d4" stroke="#46637f"/><text x="2460.0" y="1070.0" text-anchor="middle"><tspan x="2460.0" dy="0">Zleć odświeżenie publikacji i</tspan><tspan x="2460.0" dy="15">oceny</tspan></text></g><g class="node"><title>Obsłuż problem; bez końcowego odświeżenia
Zaloguj status lub zgłoś odroczony wyjątek zależnie od przebiegu. Zapis zasobu nie jest automatycznie cofany. Sam wynik walidacji nie zmienia automatycznie statusu publikacji.</title><rect x="2010.0" y="1240.0" width="220.0" height="86.0" rx="8" fill="#fff" stroke="#46637f"/><text x="2120.0" y="1280.0" text-anchor="middle"><tspan x="2120.0" dy="0">Obsłuż problem; bez końcowego</tspan><tspan x="2120.0" dy="15">odświeżenia</tspan></text></g><g class="node"><title>Zadanie przygotowania zakończone
</title><circle cx="2663.0" cy="1073.0" r="23.0" fill="#f5d9df" stroke="#344c67" stroke-width="3"/><text x="2663.0" y="1113.0" text-anchor="middle"><tspan x="2663.0" dy="0">Zadanie przygotowania</tspan><tspan x="2663.0" dy="15">zakończone</tspan></text></g></svg>