Źródło HTML: #tab=xml-seq&amp;id=SX-307</title><circle cx="200.0" cy="180.0" r="18.0" fill="#e3f2ed" stroke="#344c67" stroke-width="1.6"/><text x="200.0" y="215.0" text-anchor="middle"><tspan x="200.0" dy="0">Zapisany link zasobu</tspan></text></g><g class="node"><title>Pobierz link; ustal typ i format odpowiedzi
Typ: file/api/website; JSON/XML bez attachment może być API (U-17), text/html stroną. Format z Content-Disposition, inaczej URL/MIME; różni się od heurystyki walidacji importu. Błąd jsonstat U-11 pozostaje AS-IS. remote także może mieć kopię główną.

