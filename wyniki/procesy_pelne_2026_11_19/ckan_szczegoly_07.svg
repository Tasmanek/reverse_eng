Źródło HTML: #tab=ckan-seq&amp;id=SC-111</title><rect x="1105.0" y="515.0" width="190.0" height="90.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1200.0" y="557.0" text-anchor="middle"><tspan x="1200.0" dy="0">Dopisz „Link cannot be</tspan><tspan x="1200.0" dy="15">empty”</tspan></text></g><g class="node"><title>Pobierz i rozpoznaj brakujący format

Pobranie: poprawny URL i HTTPS także po przekierowaniach; dokładnie HTTP 200; poprawny i dozwolony Content-Type (octet-stream akceptowany), treść niepusta i bez niebezpiecznego załącznika. Heurystyka formatu walidacji: URL → magic → Content-Type → Content-Disposition. Nie jest to heurystyka późniejszego przygotowania pliku. Nieznany format przechodzi; flaga może blokować rozpoznany nieobsługiwany. Przekazanie wyniku do kontekstu następuje po udanej kontroli.

Źródło HTML: #tab=ckan&amp;node=K10

Źródło HTML: #tab=ckan-seq&amp;id=SC-111</title><rect x="1100.0" y="320.0" width="200.0" height="100.0" rx="8" fill="#fff" stroke="#46637f"/><text x="1200.0" y="416.0" text-anchor="middle" font-weight="bold">⊞</text><text x="1200.0" y="367.0" text-anchor="middle"><tspan x="1200.0" dy="0">Pobierz i rozpoznaj</tspan><tspan x="1200.0" dy="15">brakujący format</tspan></text></g><g class="node"><title>Przekaż wykryty format / None do kontekstu
Wynik udanego rozpoznania zapisuje się w context[format]. Po błędzie pobrania walidacja gromadzi błąd; dane nie zostaną przyjęte.

